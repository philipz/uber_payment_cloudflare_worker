# uber_payment_cloudflare_worker — wrangler 設定（Item 6：金流核心 bindings）
# 機密一律走 Cloudflare secrets（wrangler secret put），不在此檔或 .dev.vars 提交。
# database_id 為本機/測試佔位；部署前以 `wrangler d1 create uber-payment-poc` 的實際 id 取代。

name = "uber-payment-cloudflare-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# D1：accounts / processed_transactions / audit（語意對應來源 Postgres）
[[d1_databases]]
binding = "DB"
database_name = "uber-payment-poc"
database_id = "4bd5f27e-edac-47c4-a1e2-f14dd19b7f28"
migrations_dir = "./migrations"

# Account DO：Hot Account 串行化 + 250ms 窗口歸集（單一寫入者）
[[durable_objects.bindings]]
name = "ACCOUNT_DO"
class_name = "AccountDO"

# EventHub DO（Item 8）：領域事件廣播 hub——取代來源 Redis pub/sub（EVENTS_CHANNEL）。
# SSE 客戶端 GET /events 訂閱；AccountDO commit 成功後 POST /publish 發布 Committed 事件。
[[durable_objects.bindings]]
name = "EVENT_HUB"
class_name = "EventHubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EventHubDO"]

# Queues：finalize 下游通知（at-least-once；consumer 側冪等）。
# finalize-dlq 為死信佇列名稱（部署前以 `wrangler queues create finalize-dlq` 建立）
[[queues.producers]]
binding = "FINALIZE_QUEUE"
queue = "finalize-queue"

[[queues.consumers]]
queue = "finalize-queue"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "finalize-dlq"
