version: 2
updates:
  # 注意：npm 生態暫不加入——Dependabot 在無 package.json 的 repo 會直接報錯
  #（實測 2026-08-23：/package.json not found → Dependabot Updates 紅燈）。
  # 待 package.json/package-lock.json 落地後再加回 npm 生態。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 5
    labels:
      - dependencies
