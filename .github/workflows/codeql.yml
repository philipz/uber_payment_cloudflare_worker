# CodeQL code scanning（GHAS 功能之一；public repo 完全免費，不需 Advanced Security 授權）。
# 比照 factory CI 策略：觸發涵蓋 software-factory 與 factory/**（每層獨立掃描，
# docs/07 §2.2），並加每週排程掃描。空骨架時期（尚無 JS/TS 原始碼）以 hashFiles
# guard 跳過；程式碼落地後自動生效。
name: CodeQL

on:
  push:
    branches: [main, software-factory]
  pull_request:
    branches: [main, software-factory, 'factory/**']
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ hashFiles('**/*.{js,ts,jsx,tsx}') != '' }}
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'
